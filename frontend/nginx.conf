server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: forwarded to the backend container, so the site and the API share
    # the same domain (no CORS needed, no localhost in the frontend)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Caddy terminates HTTPS in front of nginx and sends the real protocol
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 5m;
    }

    # Files built by Vite have a hash in their name: they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/invite/:id, /friend/:id...) are handled by React Router.
    # index.html is never cached, so a new deployment is picked up right away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
